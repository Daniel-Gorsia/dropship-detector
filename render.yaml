services:
  - type: web
    name: dropship-detector-api
    runtime: node
    buildCommand: npm install -g pnpm@9 && pnpm install && pnpm --filter @dropship/shared build && pnpm --filter @dropship/core build && pnpm --filter @dropship/api build
    startCommand: node apps/api/dist/index.js
    envVars:
      - key: NODE_ENV
        value: production

  - type: web
    name: dropship-detector-web
    runtime: static
    buildCommand: npm install -g pnpm@9 && pnpm install && pnpm --filter @dropship/shared build && pnpm --filter @dropship/web build
    staticPublishPath: apps/web/dist
    envVars:
      - key: VITE_API_URL
        sync: false
